[project]
name = "jwmcp"
version = "0.2.0"
description = "MCP server for Jw_cad: read .jww, draw with walls/openings/grids/pipes, round-trip through 外部変形, turn scanned/PDF drawings into CAD"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kohei Oka / Future Studio" }]
keywords = ["jw_cad", "jww", "mcp", "cad", "claude", "dxf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=2.0",
    "ezjww>=0.3.2",
    "ezdxf>=1.3",
    "matplotlib>=3.8",
    "pdfplumber>=0.11",
    "pypdfium2>=4",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
raster = ["opencv-python-headless>=4.9"]

[project.scripts]
jwmcp = "jwmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jwmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
